version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      # Runtime libraries and their CLI/client packages must move together.
      agent-sdk-compatible:
        patterns: ['@mastra/*', 'mastra', 'ai', '@ai-sdk/*']
        update-types: [minor, patch]
      test-runner-compatible:
        patterns: ['vitest', '@vitest/*']
        update-types: [minor, patch]
      production-compatible:
        dependency-type: production
        update-types: [minor, patch]
      development-compatible:
        dependency-type: development
        update-types: [minor, patch]
    # These migrations require coordinated application/toolchain changes.
    # Keep patch/minor and security maintenance flowing independently.
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: '@vitest/*'
        update-types: [version-update:semver-major]
      - dependency-name: jsdom
        update-types: [version-update:semver-major]
      - dependency-name: '@testing-library/jest-dom'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: ai
        update-types: [version-update:semver-major]
      - dependency-name: '@ai-sdk/*'
        update-types: [version-update:semver-major]
      - dependency-name: zod
        update-types: [version-update:semver-major]
      - dependency-name: better-sqlite3
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
    groups:
      e2e-compatible:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: dotenv
        update-types: [version-update:semver-major]
      - dependency-name: iron-session
        update-types: [version-update:semver-major]
      - dependency-name: jose
        update-types: [version-update:semver-major]
  - package-ecosystem: uv
    directory: /packages/pipeline
    schedule: { interval: weekly }
    groups:
      python-utilities:
        patterns: ['click', 'neo4j', 'httpx', 'rich', 'jsonschema', 'python-dotenv', 'ruff', 'pytest', 'vulture']
        update-types: [minor, patch]
    # Parser/OCR/model updates require the separate qualification gates in #161.
    ignore:
      - dependency-name: docling*
      - dependency-name: python-docx
      - dependency-name: openpyxl
      - dependency-name: xlrd
      - dependency-name: python-pptx
      - dependency-name: pypdf*
      - dependency-name: rapidocr*
      - dependency-name: torch*
      - dependency-name: numpy
      - dependency-name: opencv*
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /packages/agent
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /packages/web
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /packages/pipeline
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
