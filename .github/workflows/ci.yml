name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Test every PR base, including the parser/chart stack.
    # Artifact-only PRs (memory/knowledge-graph refreshes) don't need tests.
    # push:main deliberately has NO paths-ignore — Railway gates deploys on
    # main's CI runs (see the concurrency note below).
    paths-ignore:
      - '.brv/**'
      - 'docs/archive/**'
      - 'graphify-out/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs/branches, but never on main: Railway gates
  # each deployment on that commit's CI and path-skips workflow/docs-only
  # commits, so cancelling a main run could strand an app-code commit's deploy
  # behind a later skipped commit (the af1fad7 -> ecc6f43 shape from 2026-06-13).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      # Used by the "Agent integration tests" step below. Pinned to the same
      # tag as docker-compose.yml so CI and local dev test the same Neo4j.
      neo4j:
        image: neo4j:2026.05-community
        env:
          NEO4J_AUTH: neo4j/medicaid-dev
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd="cypher-shell -u neo4j -p medicaid-dev 'RETURN 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=15s
      # Embedding plan tests require an empty graph and never share fixtures.
      embedding-plan-neo4j:
        image: neo4j:2026.05-community
        env:
          NEO4J_AUTH: neo4j/medicaid-dev
          NEO4J_server_memory_heap_initial__size: 256M
          NEO4J_server_memory_heap_max__size: 512M
          NEO4J_server_memory_pagecache_size: 256M
        ports:
          - 7688:7687
        options: >-
          --health-cmd="cypher-shell -u neo4j -p medicaid-dev 'RETURN 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=15s
      # Jev enrichment owns the whole graph; isolate it from other suites.
      jev-annotation-neo4j:
        image: neo4j:2026.05-community
        env:
          NEO4J_AUTH: neo4j/medicaid-dev
          NEO4J_server_memory_heap_initial__size: 256M
          NEO4J_server_memory_heap_max__size: 512M
          NEO4J_server_memory_pagecache_size: 256M
        ports:
          - 7689:7687
        options: >-
          --health-cmd="cypher-shell -u neo4j -p medicaid-dev 'RETURN 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=15s
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: medicaid-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: packages/pipeline/.python-version

      - run: npm install --global npm@11.11.0

      - run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Check the Mastra family resolves as one release set
        run: npm run check:mastra-lockfile

      - name: Test repository check scripts
        run: npm run test:scripts

      - name: Install pinned uv
        run: python -m pip install uv==0.8.22

      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-python3.11-0.8.22-${{ hashFiles('packages/pipeline/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-python3.11-0.8.22-

      - name: Check Python lockfile consistency
        run: uv lock --check
        working-directory: packages/pipeline

      - name: Provision pipeline venv
        run: npm run setup -w @nc-medicaid/pipeline

      - name: Lint (JS + Python)
        run: npm run lint

      - name: Build all workspaces
        run: npm run build

      - name: Typecheck test suites
        run: npm run typecheck:tests

      # Pipeline is excluded here because its pytest suite runs as the
      # dedicated step below — without the filter it would run twice per CI run.
      - name: Test JS workspaces
        run: npm test -- --filter='!@nc-medicaid/pipeline'

      # Explicit pytest step so pipeline failures are visible as a distinct
      # CI gate rather than hidden inside turbo's aggregate output.
      - name: Test Python pipeline
        env:
          RUN_NEO4J_INTEGRATION: '1'
        run: .venv/bin/python -m pytest tests/ -v
        working-directory: packages/pipeline

      - name: Test embedding plans (dedicated Neo4j, mocked provider)
        env:
          RUN_EMBEDDING_INTEGRATION: '1'
          NEO4J_URI: bolt://localhost:7688
        run: .venv/bin/python -m pytest tests/test_embedding_plan_integration.py -v
        working-directory: packages/pipeline

      - name: Test Jev annotations (dedicated disposable Neo4j)
        env:
          RUN_NEO4J_INTEGRATION: '1'
          JEV_DISPOSABLE_NEO4J: 'true'
          JEV_DISPOSABLE_NEO4J_URI: bolt://localhost:7689
          NEO4J_URI: bolt://localhost:7689
        run: .venv/bin/python -m pytest tests/test_jev_integration.py -v
        working-directory: packages/pipeline

      - name: Test corpus operational scripts
        run: npm run test:ops

      - name: Test offline qualification isolation guards
        run: python3 -m unittest discover -s scripts/ops/tests -p test_prepare_qualification.py

      - name: Test fee-compaction isolation guards
        run: python3 -m unittest discover -s scripts/ops/tests -p test_fee_compaction.py

      # Hermetic against the Neo4j service: the suite creates its own vector
      # indexes and `test:`-prefixed fixtures and mocks the embedding API, so
      # no pipeline data load is required.
      - name: Test cost audit and finite sample budget
        run: packages/pipeline/.venv/bin/python -m pytest scripts/ops/tests/test_audit_corpus_cost.py scripts/ops/tests/test_sample_budget_gateway.py -q

      - name: Agent integration tests (real Neo4j)
        run: npm run test:integration -w @nc-medicaid/agent

  # Mocked e2e tier, hermetically: HERMETIC_AUTH mints a sealed test session
  # and verifies it against a local JWKS stub, so no WorkOS credentials or
  # network access are needed (see e2e/helpers/test-auth.ts). The Mastra
  # backend is mocked by the suite itself. This tier previously rotted
  # because it couldn't run in CI (F-E2E-001).
  e2e-mocked:
    name: Mocked e2e (hermetic auth)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install --global npm@11.11.0

      - run: npm ci

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Test production smoke helpers
        run: node --test scripts/tests/*.test.mjs
        working-directory: e2e

      - name: Run mocked e2e suite
        run: HERMETIC_AUTH=1 npx playwright test --project=mocked
        working-directory: e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # Builds the same images Railway deploys, so production-only bundling
  # failures are caught here instead of at deploy time. The agent build runs
  # the exact `mastra build` (esbuild) bundle step that — on 2026-06-13 —
  # failed on a workspace-source import that tsc and vitest resolved fine,
  # reaching production as a broken deploy. Runs in parallel with `test`;
  # Railway gates on the whole workflow, so a failed image build blocks deploys.
  docker-build:
    name: Production Docker builds
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build agent image
        run: docker build -f packages/agent/Dockerfile -t agent-ci .

      # A bundle can build and still fail at start-up: the entrypoint migrates
      # the database, installs the memory release gate and builds the server
      # at import. Start the image and wait for liveness. Every value is a
      # placeholder: start-up validates that the settings exist and never
      # calls a provider, and /livez needs no graph. The image sets
      # NODE_ENV=production, so the production checks apply:
      #   OPENAI_API_KEY, VOYAGE_API_KEY          required, any non-empty value
      #   WORKOS_API_KEY, WORKOS_CLIENT_ID,
      #   WORKOS_REDIRECT_URI                     the WorkOS client refuses to construct without them
      #   DATABASE_URL + tmpfs /data              a production file database must live under /data
      #   NEO4J_URI, NEO4J_PASSWORD               must not be localhost or the development default
      #   CORS_ORIGINS                            must not be localhost
      - name: Boot agent image and wait for liveness
        run: |
          docker run -d --name agent-boot -p 127.0.0.1:4111:4111 --tmpfs /data \
            -e OPENAI_API_KEY=ci-placeholder \
            -e VOYAGE_API_KEY=ci-placeholder \
            -e WORKOS_API_KEY=ci-placeholder \
            -e WORKOS_CLIENT_ID=ci-placeholder \
            -e WORKOS_REDIRECT_URI=https://ci.invalid/callback \
            -e DATABASE_URL=file:/data/mastra.db \
            -e NEO4J_URI=bolt://neo4j.invalid:7687 \
            -e NEO4J_PASSWORD=ci-placeholder \
            -e CORS_ORIGINS=https://ci.invalid \
            agent-ci
          for attempt in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4111/livez)" = "200" ]; then
              echo "agent image is live after ${attempt} attempt(s)"
              docker rm -f agent-boot >/dev/null
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' agent-boot)" != "true" ]; then
              echo "agent container exited before it was live"
              break
            fi
            sleep 2
          done
          echo "agent image did not answer GET /livez with 200"
          docker logs agent-boot
          docker rm -f agent-boot >/dev/null
          exit 1

      # NEXT_PUBLIC_* args only need to be present (Next.js inlines them at
      # build time); the values are placeholders — this job validates that the
      # bundle compiles, not runtime config. Sentry source-map upload stays off
      # here because SENTRY_AUTH_TOKEN is unset (next.config.ts disables it),
      # so the build needs no Sentry secrets.
      - name: Build web image
        run: >-
          docker build -f packages/web/Dockerfile
          --build-arg NEXT_PUBLIC_MASTRA_URL=http://localhost:4111
          --build-arg NEXT_PUBLIC_WORKOS_REDIRECT_URI=http://localhost:3000/callback
          --build-arg NEXT_PUBLIC_SENTRY_DSN=
          --build-arg SENTRY_ORG=
          --build-arg SENTRY_PROJECT=
          -t web-ci .

      - name: Build corpus-job image
        run: docker build -f packages/pipeline/Dockerfile -t corpus-job-ci .
