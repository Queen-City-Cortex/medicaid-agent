name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Neo4j is used by the agent integration tests and eval-validate.
      # Provision via docker service so `RUN_NEO4J_INTEGRATION=1` paths exercise.
      neo4j:
        image: neo4j:community
        env:
          NEO4J_AUTH: neo4j/medicaid-dev
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd="cypher-shell -u neo4j -p medicaid-dev 'RETURN 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=15s
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: medicaid-dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/pipeline/pyproject.toml

      - run: npm ci

      - name: Provision pipeline venv
        run: npm run setup -w @nc-medicaid/pipeline

      - name: Lint (JS + Python)
        run: npm run lint

      - name: Build all workspaces
        run: npm run build

      - name: Test JS workspaces
        run: npm test

      # Explicit pytest step so pipeline failures are visible as a distinct
      # CI gate rather than hidden inside turbo's aggregate output.
      - name: Test Python pipeline
        run: .venv/bin/python -m pytest tests/ -v
        working-directory: packages/pipeline
