name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Artifact-only PRs (memory/knowledge-graph refreshes) don't need tests.
    # push:main deliberately has NO paths-ignore — Railway gates deploys on
    # main's CI runs (see the concurrency note below).
    paths-ignore:
      - '.brv/**'
      - 'graphify-out/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs/branches, but never on main: Railway gates
  # each deployment on that commit's CI and path-skips workflow/docs-only
  # commits, so cancelling a main run could strand an app-code commit's deploy
  # behind a later skipped commit (the af1fad7 -> ecc6f43 shape from 2026-06-13).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No e2e job: e2e/tests/auth.setup.ts requires live WorkOS hosted-login
# credentials (TEST_USER_EMAIL/TEST_USER_PASSWORD against a real WorkOS
# environment), so even the mocked tier can't run hermetically in CI.
# Tracked in the remediation plan (P2).

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      # Used by the "Agent integration tests" step below. Pinned to the same
      # tag as docker-compose.yml so CI and local dev test the same Neo4j.
      neo4j:
        image: neo4j:2026.05-community
        env:
          NEO4J_AUTH: neo4j/medicaid-dev
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd="cypher-shell -u neo4j -p medicaid-dev 'RETURN 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=15s
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: medicaid-dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/pipeline/pyproject.toml

      - run: npm ci

      - name: Provision pipeline venv
        run: npm run setup -w @nc-medicaid/pipeline

      - name: Lint (JS + Python)
        run: npm run lint

      - name: Build all workspaces
        run: npm run build

      - name: Typecheck test suites
        run: npm run typecheck:tests

      # Pipeline is excluded here because its pytest suite runs as the
      # dedicated step below — without the filter it would run twice per CI run.
      - name: Test JS workspaces
        run: npm test -- --filter='!@nc-medicaid/pipeline'

      # Explicit pytest step so pipeline failures are visible as a distinct
      # CI gate rather than hidden inside turbo's aggregate output.
      - name: Test Python pipeline
        run: .venv/bin/python -m pytest tests/ -v
        working-directory: packages/pipeline

      # Hermetic against the Neo4j service: the suite creates its own vector
      # indexes and `test:`-prefixed fixtures and mocks the embedding API, so
      # no pipeline data load is required.
      - name: Agent integration tests (real Neo4j)
        run: npm run test:integration -w @nc-medicaid/agent

  # Builds the same images Railway deploys, so production-only bundling
  # failures are caught here instead of at deploy time. The agent build runs
  # the exact `mastra build` (esbuild) bundle step that — on 2026-06-13 —
  # failed on a workspace-source import that tsc and vitest resolved fine,
  # reaching production as a broken deploy. Runs in parallel with `test`;
  # Railway gates on the whole workflow, so a failed image build blocks deploys.
  docker-build:
    name: Production Docker builds
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Build agent image
        run: docker build -f packages/agent/Dockerfile -t agent-ci .

      # NEXT_PUBLIC_* args only need to be present (Next.js inlines them at
      # build time); the values are placeholders — this job validates that the
      # bundle compiles, not runtime config. Sentry source-map upload stays off
      # here because SENTRY_AUTH_TOKEN is unset (next.config.ts disables it),
      # so the build needs no Sentry secrets.
      - name: Build web image
        run: >-
          docker build -f packages/web/Dockerfile
          --build-arg NEXT_PUBLIC_MASTRA_URL=http://localhost:4111
          --build-arg NEXT_PUBLIC_WORKOS_REDIRECT_URI=http://localhost:3000/callback
          --build-arg NEXT_PUBLIC_SENTRY_DSN=
          --build-arg SENTRY_ORG=
          --build-arg SENTRY_PROJECT=
          -t web-ci .
