name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No e2e job: e2e/tests/auth.setup.ts requires live WorkOS hosted-login
# credentials (TEST_USER_EMAIL/TEST_USER_PASSWORD against a real WorkOS
# environment), so even the mocked tier can't run hermetically in CI.
# Tracked in the remediation plan (P2).

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      # Used by the "Agent integration tests" step below. Pinned to the same
      # tag as docker-compose.yml so CI and local dev test the same Neo4j.
      neo4j:
        image: neo4j:2026.05-community
        env:
          NEO4J_AUTH: neo4j/medicaid-dev
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd="cypher-shell -u neo4j -p medicaid-dev 'RETURN 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=15s
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: medicaid-dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/pipeline/pyproject.toml

      - run: npm ci

      - name: Provision pipeline venv
        run: npm run setup -w @nc-medicaid/pipeline

      - name: Lint (JS + Python)
        run: npm run lint

      - name: Build all workspaces
        run: npm run build

      - name: Typecheck test suites
        run: npm run typecheck:tests

      # Pipeline is excluded here because its pytest suite runs as the
      # dedicated step below — without the filter it would run twice per CI run.
      - name: Test JS workspaces
        run: npm test -- --filter='!@nc-medicaid/pipeline'

      # Explicit pytest step so pipeline failures are visible as a distinct
      # CI gate rather than hidden inside turbo's aggregate output.
      - name: Test Python pipeline
        run: .venv/bin/python -m pytest tests/ -v
        working-directory: packages/pipeline

      # Hermetic against the Neo4j service: the suite creates its own vector
      # indexes and `test:`-prefixed fixtures and mocks the embedding API, so
      # no pipeline data load is required.
      - name: Agent integration tests (real Neo4j)
        run: npm run test:integration -w @nc-medicaid/agent
