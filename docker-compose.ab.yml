# Isolated Neo4j for A/B model-comparison evals (see scripts/eval-ab.sh).
#
# Holds a *candidate* embedding corpus (e.g. voyage-4-large at 2048 dims) on a
# separate port so it never touches the production voyage-law-2 graph managed by
# docker-compose.yml. Neo4j Community is single-database, so isolation is by
# container/URI, not by `NEO4J_DATABASE`.
#
#   docker compose -f docker-compose.ab.yml up -d --wait   # bolt://localhost:7688
#   docker compose -f docker-compose.ab.yml down -v         # discard the candidate corpus
#
# Unlike the production compose file, the volume here is NOT external: it is
# disposable on purpose so `down -v` wipes the candidate corpus between A/B runs.
services:
  neo4j-ab:
    image: neo4j:2026.05-community
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/medicaid-dev
    volumes:
      - neo4j-ab-data:/data
    healthcheck:
      # Run the authenticated `RETURN 1` through the HTTP Query API instead of
      # cypher-shell: every cypher-shell call boots two JVMs (~1.3s at 200%+
      # CPU), which at a 5s interval spikes host CPU for as long as the
      # container is up. wget checks the same credentials and Cypher path for
      # almost nothing.
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - --user=neo4j
        - --password=medicaid-dev
        - "--header=Content-Type: application/json"
        - '--post-data={"statement":"RETURN 1"}'
        - http://localhost:7474/db/neo4j/query/v2
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  neo4j-ab-data:
