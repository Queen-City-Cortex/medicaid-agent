services:
  neo4j:
    image: neo4j:community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/medicaid-dev
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "medicaid-dev", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  neo4j-data:
    external: true
    name: neo4j-medicaid-data
