services:
  neo4j:
    # Pin the image so dev/CI don't silently jump major versions when the
    # floating `community` tag moves.
    image: neo4j:2026.05-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/medicaid-dev
    volumes:
      - neo4j-data:/data
    healthcheck:
      # Run the authenticated `RETURN 1` through the HTTP Query API instead of
      # cypher-shell: every cypher-shell call boots two JVMs (~1.3s at 200%+
      # CPU), which at a 5s interval spikes host CPU for as long as the
      # container is up. wget checks the same credentials and Cypher path for
      # almost nothing.
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - --user=neo4j
        - --password=medicaid-dev
        - "--header=Content-Type: application/json"
        - '--post-data={"statement":"RETURN 1"}'
        - http://localhost:7474/db/neo4j/query/v2
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  # External so compose never tries to own/recreate the volume that holds the
  # loaded policy graph. The npm `dev` / `dev:infra` scripts create it
  # automatically (`docker volume create` is idempotent), so a fresh clone's
  # `npm run dev` works without manual setup.
  neo4j-data:
    external: true
    name: neo4j-medicaid-data
