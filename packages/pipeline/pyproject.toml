[project]
name = "nc-medicaid-pipeline"
version = "1.0.0"
description = "Document parsing pipeline for NC Medicaid policy documents"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.105",
    "docling-core>=2.83",
    "neo4j>=6.3.1",
    "httpx>=0.28",
    "click>=8.5.0",
    "rich>=15.0",
    "jsonschema>=4.26",
    "python-dotenv>=1.2.4",
    "python-docx>=1.2",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2,<3",
    "python-pptx>=1.0.2,<2",
    "pypdf>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "ruff>=0.16.10",
    "vulture>=2.16",
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]
# Vulture whitelist is intentionally a list of bare names (would trip F821).
extend-exclude = ["vulture_whitelist.py"]

[tool.ruff.lint]
# Keep the project's established Ruff baseline explicit. Ruff 0.15 broadened
# its implicit defaults, which turned a dependency update into 73 unrelated
# style failures without the project opting into those additional rule sets.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
